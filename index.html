function refreshChipRow(){
  document.getElementById('chipRowWrap').innerHTML = renderEspecChips();
  document.getElementById('especGradeTable').innerHTML = renderEspecGradeTable();
  wireChipRow();
  wireEspecGradeTable();
}

function wireChipRow(){
  document.querySelectorAll('[data-act="select-espec"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      raidPageCache.activeEspec = el.getAttribute('data-espec');
      document.querySelectorAll('.chip').forEach(c=> c.classList.toggle('active', c.getAttribute('data-espec')===raidPageCache.activeEspec));
      document.getElementById('especGradeTable').innerHTML = renderEspecGradeTable();
      wireEspecGradeTable();
    });
  });
  document.querySelectorAll('[data-act="remove-espec"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const espec = el.getAttribute('data-espec');
      raidPageCache.extraEspecs = raidPageCache.extraEspecs.filter(x=>x!==espec);
      if(raidPageCache.activeEspec === espec){
        raidPageCache.activeEspec = raidPageCache.especsPresent[0] || raidPageCache.extraEspecs[0] || null;
      }
      refreshChipRow();
    });
  });
  document.querySelectorAll('[data-act="move-espec-left"]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isOfficer() || el.classList.contains('disabled')) return;
      const espec = el.getAttribute('data-espec');
      const { especsPresent, especDisplay } = raidPageCache;
      const idx = especsPresent.indexOf(espec);
      const neighbor = especsPresent[idx-1];
      if(!neighbor) return;
      swapEspecOrder(especDisplay.order, espec, neighbor);
      await storeSet('espec-display', especDisplay);
      // reflect the swap locally so the row re-renders in the new order immediately
      [especsPresent[idx-1], especsPresent[idx]] = [especsPresent[idx], especsPresent[idx-1]];
      refreshChipRow();
    });
  });
  document.querySelectorAll('[data-act="move-espec-right"]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isOfficer() || el.classList.contains('disabled')) return;
      const espec = el.getAttribute('data-espec');
      const { especsPresent, especDisplay } = raidPageCache;
      const idx = especsPresent.indexOf(espec);
      const neighbor = especsPresent[idx+1];
      if(!neighbor) return;
      swapEspecOrder(especDisplay.order, espec, neighbor);
      await storeSet('espec-display', especDisplay);
      [especsPresent[idx+1], especsPresent[idx]] = [especsPresent[idx], especsPresent[idx+1]];
      refreshChipRow();
    });
  });
  document.querySelectorAll('[data-act="hide-espec"]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!isOfficer()) return;
      const espec = el.getAttribute('data-espec');
      const { especsPresent, especDisplay } = raidPageCache;
      if(!especDisplay.hidden.includes(espec)) especDisplay.hidden.push(espec);
      await storeSet('espec-display', especDisplay);
      raidPageCache.especsPresent = especsPresent.filter(x=>x!==espec);
      if(raidPageCache.activeEspec === espec){
        raidPageCache.activeEspec = raidPageCache.especsPresent[0] || raidPageCache.extraEspecs[0] || null;
      }
      refreshChipRow();
    });
  });
  const addSel = document.getElementById('addEspecSelect');
  if(addSel) addSel.addEventListener('change', (e)=>{
    const v = e.target.value;
    if(!v) return;
    raidPageCache.extraEspecs.push(v);
    raidPageCache.activeEspec = v;
    refreshChipRow();
  });
  const editBtn = document.getElementById('toggleChipEditBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{
    raidPageCache.chipEditMode = !raidPageCache.chipEditMode;
    refreshChipRow();
  });
  const manageBtn = document.getElementById('manageHiddenBtn');
  if(manageBtn) manageBtn.addEventListener('click', openManageHiddenModal);
}

// Swaps two espec names' positions within the shared order array.
function swapEspecOrder(orderArr, a, b){
  const iA = orderArr.indexOf(a), iB = orderArr.indexOf(b);
  if(iA<0 || iB<0) return;
  const tmp = orderArr[iA]; orderArr[iA] = orderArr[iB]; orderArr[iB] = tmp;
}

function openManageHiddenModal(){
  if(!isOfficer()) return;
  const especDisplay = raidPageCache.especDisplay;
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal" style="max-width:440px;">
    <h3>Hidden classes</h3>
    <p>These classes are hidden from the espec tab row on every raid night. Show one again to bring it back.</p>
    <div class="hidden-list" id="hiddenList"></div>
    <div class="modal-actions"><button class="btn" id="hmClose">Close</button></div>
  </div>`;
  document.body.appendChild(wrap);
  function paint(){
    const list = wrap.querySelector('#hiddenList');
    if(!especDisplay.hidden.length){ list.innerHTML = `<p class="small-muted">Nothing hidden.</p>`; return; }
    list.innerHTML = especDisplay.hidden.map(e=>`
      <div class="hidden-row"><span>${esc(e)}</span><button class="btn btn-sm" data-espec="${escAttr(e)}">Show</button></div>
    `).join('');
    list.querySelectorAll('button[data-espec]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const espec = btn.getAttribute('data-espec');
        especDisplay.hidden = especDisplay.hidden.filter(x=>x!==espec);
        await storeSet('espec-display', especDisplay);
        paint();
        refreshChipRow();
      });
    });
  }
  paint();
  wrap.addEventListener('click', e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#hmClose').addEventListener('click', ()=> wrap.remove());
}

function confirmModal(title, desc, onConfirm){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p>${esc(desc)}</p>
    <div class="modal-actions"><button class="btn" id="cmCancel">Cancel</button><button class="btn btn-danger" id="cmOk">Delete</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#cmCancel').addEventListener('click', ()=> wrap.remove());
  wrap.querySelector('#cmOk').addEventListener('click', ()=>{ wrap.remove(); onConfirm(); });
}

/* =========================================================================
   PAGE: BENCHMARKS
   ========================================================================= */

let benchPageCache = { espec:null, variant:null, benchmarks:null, skillPool:[] };

async function renderBenchmarksPage(espec){
  const benchmarks = await ensureBenchmarks();
  benchPageCache.benchmarks = benchmarks;
  benchPageCache.espec = espec && (ALL_ESPECS.includes(espec) || espec===GENERAL_KEY) ? espec : (benchPageCache.espec || GENERAL_KEY);
  const bench = benchmarks[benchPageCache.espec];
  benchPageCache.variant = bench.variants[bench.activeVariant] ? bench.activeVariant : Object.keys(bench.variants)[0];

  // best-effort skill pool from any cached raid page data
  benchPageCache.skillPool = [];
  if(raidPageCache.raid){
    const names = new Set();
    raidPageCache.raid.fights.forEach(f=> f.players.forEach(p=>{ if(p.profession===benchPageCache.espec) Object.keys(p.casts||{}).forEach(n=>names.add(n)); }));
    benchPageCache.skillPool = Array.from(names);
  }

  const sidebar = renderEspecSidebar();
  const main = renderBenchmarkMain();

  return `
  <div class="page-head">
    <div><div class="eyebrow">Configuration</div><h1 class="page-title">Benchmarks</h1>
    <p class="page-desc">Define grading thresholds per elite spec. Metrics can be any stat found in your logs — built-in performance stats, boon uptime/generation, or a specific skill's cast rate.</p></div>
  </div>
  <div class="bench-layout">
    <div class="espec-sidebar" id="especSidebar">${sidebar}</div>
    <div class="bench-main" id="benchMain">${main}</div>
  </div>`;
}

function renderEspecSidebar(){
  let html = `<div class="espec-item ${benchPageCache.espec===GENERAL_KEY?'active':''}" data-espec="${GENERAL_KEY}">General</div>`;
  html += `<div class="hr" style="margin:10px 0;"></div>`;
  for(const group in ESPEC_GROUPS){
    html += `<div class="espec-group-label">${esc(group)}</div>`;
    ESPEC_GROUPS[group].forEach(e=>{
      html += `<div class="espec-item ${benchPageCache.espec===e?'active':''}" data-espec="${escAttr(e)}">${esc(e)}</div>`;
    });
  }
  return html;
}

function renderBenchmarkMain(){
  const benchmarks = benchPageCache.benchmarks;
  const espec = benchPageCache.espec;
  const bench = benchmarks[espec];
  const variantNames = Object.keys(bench.variants);
  const variant = bench.variants[benchPageCache.variant];
  const officer = isOfficer();

  const variantTabs = variantNames.map(v=>`
    <span class="variant-tab ${v===benchPageCache.variant?'active':''}" data-act="pick-variant" data-variant="${escAttr(v)}">
      ${v===bench.activeVariant?'<span class="default-dot" title="default"></span>':''}${esc(bench.variants[v].label||v)}
    </span>`).join('');

  const rows = variant.metrics.map((m,i)=>renderMetricRow(m, i, variant.metrics.length)).join('');

  return `
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:4px;">
    <h2 style="font-size:19px;">${esc(espec)}</h2>
    ${officer ? `<div style="display:flex;gap:8px;">
      ${espec!==GENERAL_KEY ? `<button class="btn btn-sm" id="setDefaultVariantBtn" ${bench.activeVariant===benchPageCache.variant?'disabled':''}>Set as default</button>` : ''}
      ${espec!==GENERAL_KEY && variantNames.length>1 ? `<button class="btn btn-sm btn-danger" id="deleteVariantBtn">Delete variant</button>` : ''}
    </div>` : `<span class="role-badge role-badge-viewer">Read-only</span>`}
  </div>

  <div class="variant-row" style="margin-top:14px;">
    ${variantTabs}
    ${(officer && espec!==GENERAL_KEY) ? `<button class="btn btn-sm btn-ghost" id="addVariantBtn">+ Add variant</button>` : ''}
  </div>

  <div class="table-wrap">
    <table class="metric-editor-table">
      <thead><tr>
        ${officer ? `<th style="width:44px;"></th>` : ''}
        <th style="width:170px;">Metric</th>
        <th style="width:210px;">Source</th>
        <th style="width:110px;">Unit</th>
        <th style="width:70px;">Weight</th>
        <th style="width:150px;">Mode</th>
        <th style="width:70px;">Direction</th>
        <th style="width:64px;">S</th><th style="width:64px;">A</th><th style="width:64px;">B</th><th style="width:64px;">C</th><th style="width:64px;">D</th>
        ${officer ? `<th style="width:36px;"></th>` : ''}
      </tr></thead>
      <tbody id="metricRowsBody">${rows || `<tr><td colspan="${officer?13:11}" class="small-muted" style="padding:16px;">No metrics yet${officer?' — add one below.':' for this espec.'}</td></tr>`}</tbody>
    </table>
  </div>
  ${officer ? `<div style="margin-top:12px;"><button class="btn" id="addMetricBtn">+ Add metric</button></div>` : ''}
  <p class="legend-note">Direction "Higher is better" grades S as the highest bar to clear; "Lower is better" grades S as the lowest (best) number, e.g. Deaths/min. "Info only" metrics are tracked and shown but don't count toward Overall. Column order here also sets the column order shown on raid night grade tables.</p>
  `;
}

function renderUnitCell(m){
  const nativeUnit = nativeUnitForSource(m.source);
  if(nativeUnit === 'per_second' || nativeUnit === 'per_minute'){
    const cur = normalizeDisplayUnit(m.unit, nativeUnit);
    return `<select data-field="unit">
      <option value="per_second" ${cur==='per_second'?'selected':''}>per second</option>
      <option value="per_minute" ${cur==='per_minute'?'selected':''}>per minute</option>
    </select>`;
  }
  const fixed = unitForSource(m.source) || m.unit || '—';
  return `<input type="text" value="${escAttr(fixed)}" disabled title="This metric isn't a time-based rate, so its unit is fixed.">`;
}

function renderMetricRow(m, index, total){
  if(!isOfficer()){
    const nativeUnit = nativeUnitForSource(m.source);
    const displayUnit = (nativeUnit==='per_second'||nativeUnit==='per_minute')
      ? normalizeDisplayUnit(m.unit, nativeUnit)
      : (unitForSource(m.source) || m.unit || '—');
    return `
    <tr data-metric-id="${escAttr(m.id)}">
      <td>${esc(m.label)}</td>
      <td class="small-muted">${esc(labelForSource(m.source))}</td>
      <td class="small-muted">${esc(unitDisplayLabel(displayUnit))}</td>
      <td>${m.weight}</td>
      <td>${m.mode==='graded' ? 'Graded' : 'Info only'}</td>
      <td>${m.dir==='higher' ? 'Higher ⬆' : 'Lower ⬇'}</td>
      <td class="mono">${m.thresholds.S}</td>
      <td class="mono">${m.thresholds.A}</td>
      <td class="mono">${m.thresholds.B}</td>
      <td class="mono">${m.thresholds.C}</td>
      <td class="mono">${m.thresholds.D}</td>
    </tr>`;
  }
  return `
  <tr data-metric-id="${escAttr(m.id)}">
    <td><div class="row-reorder">
      <button type="button" class="icon-btn" data-act="move-metric-up" title="Move up" ${index===0?'disabled':''}>↑</button>
      <button type="button" class="icon-btn" data-act="move-metric-down" title="Move down" ${index===total-1?'disabled':''}>↓</button>
    </div></td>
    <td><input type="text" class="label-in" data-field="label" value="${escAttr(m.label)}"></td>
    <td><select class="src-in" data-field="source">${metricSourceOptionsHtml(m.source, benchPageCache.skillPool)}</select></td>
    <td>${renderUnitCell(m)}</td>
    <td><input type="number" step="0.1" class="num-in" data-field="weight" value="${m.weight}"></td>
    <td><div class="mode-toggle">
      <button type="button" class="mode-btn ${m.mode==='graded'?'active':''}" data-field="mode" data-val="graded">Graded</button>
      <button type="button" class="mode-btn ${m.mode==='info'?'active':''}" data-field="mode" data-val="info">Info only</button>
    </div></td>
    <td><select data-field="dir"><option value="higher" ${m.dir==='higher'?'selected':''}>Higher ⬆</option><option value="lower" ${m.dir==='lower'?'selected':''}>Lower ⬇</option></select></td>
    <td><input type="number" step="any" class="num-in" data-field="thS" value="${m.thresholds.S}"></td>
    <td><input type="number" step="any" class="num-in" data-field="thA" value="${m.thresholds.A}"></td>
    <td><input type="number" step="any" class="num-in" data-field="thB" value="${m.thresholds.B}"></td>
    <td><input type="number" step="any" class="num-in" data-field="thC" value="${m.thresholds.C}"></td>
    <td><input type="number" step="any" class="num-in" data-field="thD" value="${m.thresholds.D}"></td>
    <td><button class="icon-btn btn-danger" data-act="delete-metric" title="Delete metric">✕</button></td>
  </tr>`;
}

async function saveBenchState(){
  if(!isOfficer()) return;
  await storeSet('benchmarks', benchPageCache.benchmarks);
}

function currentVariantObj(){
  return benchPageCache.benchmarks[benchPageCache.espec].variants[benchPageCache.variant];
}

function wireBenchmarksPage(){
  document.querySelectorAll('#especSidebar .espec-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const espec = el.getAttribute('data-espec');
      location.hash = '#/benchmarks/'+encodeURIComponent(espec);
    });
  });

  const addVariantBtn = document.getElementById('addVariantBtn');
  if(addVariantBtn) addVariantBtn.addEventListener('click', async ()=>{
    if(!isOfficer()) return;
    const name = prompt('Name this variant (e.g. "Heal SA", "Power DPS"):');
    if(!name) return;
    const key = name.trim().toLowerCase().replace(/\s+/g,'-')+'-'+uid().slice(0,4);
    benchPageCache.benchmarks[benchPageCache.espec].variants[key] = { label:name.trim(), metrics:[] };
    benchPageCache.variant = key;
    await saveBenchState();
    refreshBenchMain();
  });

  const delVariantBtn = document.getElementById('deleteVariantBtn');
  if(delVariantBtn) delVariantBtn.addEventListener('click', ()=>{
    if(!isOfficer()) return;
    confirmModal('Delete this variant?', 'All metric configuration for this variant will be lost.', async ()=>{
      const bench = benchPageCache.benchmarks[benchPageCache.espec];
      delete bench.variants[benchPageCache.variant];
      const remaining = Object.keys(bench.variants);
      bench.activeVariant = remaining.includes(bench.activeVariant) ? bench.activeVariant : remaining[0];
      benchPageCache.variant = remaining[0];
      await saveBenchState();
      refreshBenchMain();
    });
  });

  const setDefaultBtn = document.getElementById('setDefaultVariantBtn');
  if(setDefaultBtn) setDefaultBtn.addEventListener('click', async ()=>{
    if(!isOfficer()) return;
    benchPageCache.benchmarks[benchPageCache.espec].activeVariant = benchPageCache.variant;
    await saveBenchState();
    refreshBenchMain();
  });

  document.querySelectorAll('[data-act="pick-variant"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      benchPageCache.variant = el.getAttribute('data-variant');
      refreshBenchMain();
    });
  });

  const addMetricBtn = document.getElementById('addMetricBtn');
  if(addMetricBtn) addMetricBtn.addEventListener('click', async ()=>{
    if(!isOfficer()) return;
    const v = currentVariantObj();
    const defaultSource = 'builtin:damage';
    v.metrics.push({
      id: uid(), label: labelForSource(defaultSource), source: defaultSource, unit: unitForSource(defaultSource),
      weight:1, mode:'graded', dir:'higher', thresholds:{S:100,A:80,B:60,C:40,D:20}
    });
    await saveBenchState();
    refreshBenchMain();
  });

  wireMetricRows();
}

function wireMetricRows(){
  if(!isOfficer()) return; // read-only rows have no inputs/buttons to wire up
  const body = document.getElementById('metricRowsBody');
  if(!body) return;
  body.querySelectorAll('tr[data-metric-id]').forEach(tr=>{
    const metricId = tr.getAttribute('data-metric-id');
    const v = currentVariantObj();
    const metric = v.metrics.find(m=>m.id===metricId);
    if(!metric) return;

    tr.querySelectorAll('[data-field]').forEach(input=>{
      const field = input.getAttribute('data-field');
      const evName = (input.tagName==='SELECT' || input.type==='number' || input.type==='text') ? 'change' : 'click';
      input.addEventListener(evName, async ()=>{
        if(field === 'label') metric.label = input.value;
        else if(field === 'unit') metric.unit = input.value;
        else if(field === 'weight') metric.weight = parseFloat(input.value)||0;
        else if(field === 'dir') metric.dir = input.value;
        else if(field.startsWith('th')) metric.thresholds[field.slice(2)] = parseFloat(input.value)||0;
        else if(field === 'mode'){
          metric.mode = input.getAttribute('data-val');
          tr.querySelectorAll('.mode-btn').forEach(b=> b.classList.toggle('active', b===input));
        }
        else if(field === 'source'){
          // Auto-populate the label from the source, but only if the label was still
          // at its auto-generated default — never clobber a name the admin typed in.
          const oldSource = metric.source;
          const wasAutoLabel = !metric.label || metric.label === labelForSource(oldSource) || metric.label === 'New Metric';
          if(input.value === '__custom_skill__'){
            const name = prompt('Skill name (exact, as it appears in-game):');
            if(name && name.trim()){
              metric.source = 'skill_cast:'+name.trim();
              metric.unit = 'per_minute';
              if(wasAutoLabel) metric.label = labelForSource(metric.source);
            } else {
              input.value = metric.source; // revert
              return;
            }
          } else {
            metric.source = input.value;
            metric.unit = unitForSource(input.value);
            if(wasAutoLabel) metric.label = labelForSource(metric.source);
          }
          await saveBenchState();
          refreshBenchMain();
          return;
        }
        await saveBenchState();
      });
    });

    const delBtn = tr.querySelector('[data-act="delete-metric"]');
    if(delBtn) delBtn.addEventListener('click', async ()=>{
      v.metrics = v.metrics.filter(m=>m.id!==metricId);
      await saveBenchState();
      refreshBenchMain();
    });

    const upBtn = tr.querySelector('[data-act="move-metric-up"]');
    if(upBtn) upBtn.addEventListener('click', async ()=>{
      const idx = v.metrics.findIndex(m=>m.id===metricId);
      if(idx > 0){
        [v.metrics[idx-1], v.metrics[idx]] = [v.metrics[idx], v.metrics[idx-1]];
        await saveBenchState();
        refreshBenchMain();
      }
    });
    const downBtn = tr.querySelector('[data-act="move-metric-down"]');
    if(downBtn) downBtn.addEventListener('click', async ()=>{
      const idx = v.metrics.findIndex(m=>m.id===metricId);
      if(idx >= 0 && idx < v.metrics.length-1){
        [v.metrics[idx+1], v.metrics[idx]] = [v.metrics[idx], v.metrics[idx+1]];
        await saveBenchState();
        refreshBenchMain();
      }
    });
  });
}

function refreshBenchMain(){
  document.getElementById('benchMain').innerHTML = renderBenchmarkMain();
  document.getElementById('especSidebar').innerHTML = renderEspecSidebar();
  wireBenchmarksPage();
}

function wireUpPage(){
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', logOut);
  const manageAccessBtn = document.getElementById('manageAccessBtn');
  if(manageAccessBtn) manageAccessBtn.addEventListener('click', openManageAccessModal);

  const r = state.route;
  if(r.page === 'upload') wireUploadPage();
  else if(r.page === 'raid') wireRaidPage();
  else if(r.page === 'benchmarks') wireBenchmarksPage();
}

function openManageAccessModal(){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal" style="max-width:380px;">
    <h3>Manage access</h3>
    <p>Leave a field blank to keep its current passphrase unchanged.</p>
    <div class="field" style="margin-bottom:12px;"><label>New viewer passphrase</label><input type="password" id="maViewer" autocomplete="new-password"></div>
    <div class="field" style="margin-bottom:4px;"><label>New officer passphrase</label><input type="password" id="maOfficer" autocomplete="new-password"></div>
    <div id="maError" class="auth-error" style="display:none;margin-top:10px;"></div>
    <div class="modal-actions" style="margin-top:14px;"><button class="btn" id="maCancel">Cancel</button><button class="btn btn-primary" id="maSave">Save</button></div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#maCancel').addEventListener('click', ()=> wrap.remove());
  wrap.querySelector('#maSave').addEventListener('click', async ()=>{
    const newViewer = wrap.querySelector('#maViewer').value;
    const newOfficer = wrap.querySelector('#maOfficer').value;
    if(newViewer && newOfficer && newViewer === newOfficer){
      const err = wrap.querySelector('#maError');
      err.textContent = 'Use two different passphrases.'; err.style.display='block';
      return;
    }
    const config = await getAuthConfig();
    if(newViewer) config.viewerHash = await sha256Hex(newViewer);
    if(newOfficer) config.officerHash = await sha256Hex(newOfficer);
    await storeSet('auth-config', config);
    wrap.remove();
    toast('Passphrases updated.');
  });
}
