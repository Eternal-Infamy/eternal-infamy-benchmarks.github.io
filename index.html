<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skirmish Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── Footer ─────────────────────────────────────── */
footer {
  border-top: 1px solid var(--rule);
  text-align: center;
  padding: 1.25rem 1.5rem;
  font-size: 0.8rem;
  color: var(--muted);
}

:root{
  --bg:#0a0c10;
  --panel:#12151b;
  --panel2:#171b22;
  --panel3:#1c2129;
  --border:#242832;
  --border-soft:#1a1e26;
  --text:#e7e9ec;
  --text-dim:#9aa1ac;
  --text-faint:#5c6470;
  --accent:#d9a441;
  --accent-dim:#8a6a2e;
  --accent2:#6ea8ff;
  --danger:#e5675f;
  --good:#58d68d;
  --grade-S:#b490f5;
  --grade-A:#58d68d;
  --grade-B:#5dade2;
  --grade-C:#f5b041;
  --grade-D:#ec7063;
  --grade-F:#8a3530;
  --radius:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 15% -10%, #151a22 0%, var(--bg) 55%);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;letter-spacing:-0.01em;margin:0;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--accent2);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-dim);color:#fff;}

/* ---------- layout ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(10,12,16,0.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.topbar-inner{
  max-width:1360px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;gap:28px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:30px;height:30px;border-radius:7px;
  background:linear-gradient(155deg, var(--accent) 0%, #8a5c1e 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora';font-weight:800;color:#0a0c10;font-size:15px;
  box-shadow:0 0 0 1px rgba(217,164,65,0.25), 0 4px 14px -4px rgba(217,164,65,0.4);
}
.brand-name{font-family:'Sora';font-weight:700;font-size:16.5px;letter-spacing:-0.01em;}
.brand-sub{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.14em;margin-top:-2px;}
.nav{display:flex;gap:4px;flex:1;}
.nav-item{
  padding:8px 14px;border-radius:6px;color:var(--text-dim);font-size:13.5px;font-weight:500;
  border:1px solid transparent;
}
.nav-item:hover{color:var(--text);background:var(--panel2);text-decoration:none;}
.nav-item.active{color:var(--text);background:var(--panel2);border-color:var(--border);}
.topbar-actions{display:flex;gap:8px;}

.page{max-width:1360px;margin:0 auto;padding:28px 24px 80px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.page-title{font-size:24px;font-weight:700;}
.page-desc{color:var(--text-dim);font-size:13px;margin-top:6px;max-width:640px;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--accent);font-weight:600;margin-bottom:4px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel2);color:var(--text);font-size:13px;font-weight:500;
  transition:background .12s, border-color .12s;
}
.btn:hover{background:var(--panel3);border-color:#333944;text-decoration:none;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#1a1305;font-weight:600;}
.btn-primary:hover{background:#e4b25c;}
.btn-danger{color:var(--danger);}
.btn-danger:hover{background:rgba(229,103,95,0.1);border-color:rgba(229,103,95,0.4);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--panel2);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn[disabled]:hover{background:var(--panel2);border-color:var(--border);}
.icon-btn{padding:4px 7px;border-radius:5px;font-size:12px;line-height:1;}
.row-reorder{display:flex;flex-direction:column;gap:2px;}
.row-reorder .icon-btn{padding:2px 6px;background:var(--panel3);border:1px solid var(--border);color:var(--text-dim);}
.row-reorder .icon-btn:hover:not(:disabled){background:var(--panel2);color:var(--text);}
.row-reorder .icon-btn:disabled{opacity:0.25;cursor:default;}

/* ---------- cards / panels ---------- */
.panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);}
.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px 18px;}
.card-list{display:flex;flex-direction:column;gap:10px;}
.raid-card{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 18px;background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);
  transition:border-color .12s, background .12s;
}
.raid-card:hover{border-color:var(--border);background:var(--panel2);}
.raid-name-row{display:flex;align-items:center;gap:9px;}
.raid-name{font-size:16px;font-weight:600;font-family:'Sora';}
.raid-date{font-size:12px;color:var(--text-faint);margin-top:3px;}
.tag{
  display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10.5px;
  font-weight:600;text-transform:uppercase;letter-spacing:0.05em;border:1px solid;
}
.tag-excluded{color:var(--accent);border-color:var(--accent-dim);background:rgba(217,164,65,0.08);}
.raid-meta{display:flex;align-items:center;gap:18px;}
.raid-fightcount{font-size:12.5px;color:var(--text-dim);}
.empty-state{
  text-align:center;padding:70px 20px;color:var(--text-faint);border:1px dashed var(--border);border-radius:var(--radius);
}
.empty-state h3{color:var(--text-dim);margin-bottom:8px;font-size:16px;}
.empty-state p{font-size:13px;max-width:420px;margin:0 auto 18px;}

/* ---------- grade badges ---------- */
.grade{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:26px;height:22px;padding:0 6px;border-radius:5px;
  font-family:'Sora';font-weight:700;font-size:12px;color:#0a0c10;
}
.grade-S{background:var(--grade-S);}
.grade-A{background:var(--grade-A);}
.grade-B{background:var(--grade-B);}
.grade-C{background:var(--grade-C);color:#241800;}
.grade-D{background:var(--grade-D);color:#fff;}
.grade-F{background:var(--grade-F);color:#fff;}
.grade-dash{
  display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;
  color:var(--text-faint);font-size:12px;
}
.metric-cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
.metric-val{font-size:11.5px;color:var(--text-dim);font-family:'JetBrains Mono';}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:var(--radius);}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap;}
thead th{
  text-align:left;padding:10px 14px;background:var(--panel2);color:var(--text-faint);
  font-size:10.5px;text-transform:uppercase;letter-spacing:0.07em;font-weight:600;
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;
}
th.th-sortable{cursor:pointer;user-select:none;}
th.th-sortable:hover{color:var(--text-dim);background:var(--panel3);}
.sort-arrow{font-size:9px;margin-left:2px;color:var(--accent);}
.sort-arrow-inactive{color:var(--text-faint);opacity:0.45;}
thead th .wt{display:block;font-size:9.5px;color:var(--text-faint);text-transform:none;letter-spacing:0;margin-top:2px;font-weight:400;}
tbody td{padding:9px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--panel2);}
.player-cell .pname{font-weight:600;color:var(--text);}
.player-cell .pacc{font-size:11px;color:var(--text-faint);margin-top:1px;}
.dur-cell{color:var(--text-dim);font-family:'JetBrains Mono';font-size:12px;}

/* ---------- tabs / chips ---------- */
.chip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chip{
  display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;border-radius:20px;
  border:1px solid var(--border);background:var(--panel2);font-size:13px;font-weight:500;color:var(--text-dim);
}
.chip.active{border-color:var(--accent-dim);background:rgba(217,164,65,0.1);color:var(--text);}
.chip .x{
  width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);font-size:11px;
}
.chip .x:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.chip-reorder{
  width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:13px;font-weight:700;cursor:pointer;
}
.chip-reorder:hover{background:rgba(255,255,255,0.08);color:var(--text);}
.chip-reorder.disabled{color:var(--text-faint);opacity:0.3;cursor:default;pointer-events:none;}
.chip-hide{
  width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;cursor:pointer;opacity:0.75;
}
.chip-hide:hover{background:rgba(255,255,255,0.08);opacity:1;}
.hidden-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;margin:14px 0;}
.hidden-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--panel2);border-radius:6px;font-size:13px;}
.chip-add select{
  background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);border-radius:20px;
  padding:7px 12px;font-size:13px;
}

.section-title{font-size:15px;font-weight:700;font-family:'Sora';margin:34px 0 4px;}
.section-sub{font-size:12px;color:var(--text-faint);margin-bottom:14px;}

/* ---------- upload ---------- */
.dropzone{
  border:1.5px dashed var(--border);border-radius:12px;padding:56px 24px;text-align:center;
  transition:border-color .15s, background .15s;cursor:pointer;background:var(--panel);
}
.dropzone.hover{border-color:var(--accent);background:rgba(217,164,65,0.06);}
.dropzone h3{font-size:16px;margin-bottom:6px;}
.dropzone p{color:var(--text-faint);font-size:12.5px;}
.upload-list{margin-top:20px;display:flex;flex-direction:column;gap:8px;}
.upload-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--border-soft);font-size:12.5px;
}
.upload-row .fname{font-family:'JetBrains Mono';color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;}
.status-pill{font-size:10.5px;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;}
.status-pending{background:#20242c;color:var(--text-faint);}
.status-parsing{background:rgba(110,168,255,0.12);color:var(--accent2);}
.status-done{background:rgba(88,214,141,0.12);color:var(--good);}
.status-error{background:rgba(229,103,95,0.12);color:var(--danger);}
.status-skipped{background:rgba(217,164,65,0.12);color:var(--accent);}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;
  padding:8px 10px;font-size:13px;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent-dim);}
.inline-edit{
  background:transparent;border:1px solid transparent;color:inherit;font:inherit;padding:2px 4px;border-radius:4px;
}
.inline-edit:hover{background:var(--panel2);border-color:var(--border);}
.inline-edit:focus{outline:none;background:var(--panel2);border-color:var(--accent-dim);}

/* ---------- benchmarks editor ---------- */
.espec-sidebar{display:flex;flex-direction:column;gap:2px;width:210px;flex-shrink:0;}
.espec-group-label{font-size:10px;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-faint);margin:14px 0 4px;padding:0 10px;}
.espec-group-label:first-child{margin-top:0;}
.espec-item{
  padding:7px 10px;border-radius:6px;font-size:13px;color:var(--text-dim);cursor:pointer;border:1px solid transparent;
  display:flex;justify-content:space-between;align-items:center;
}
.espec-item:hover{background:var(--panel2);}
.espec-item.active{background:var(--panel3);color:var(--text);border-color:var(--border);font-weight:600;}
.espec-item .cnt{font-size:10.5px;color:var(--text-faint);font-family:'JetBrains Mono';}
.bench-layout{display:flex;gap:22px;align-items:flex-start;}
.bench-main{flex:1;min-width:0;}
.variant-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.variant-tab{
  padding:6px 13px;border-radius:6px;font-size:12.5px;border:1px solid var(--border);background:var(--panel2);color:var(--text-dim);
  display:flex;align-items:center;gap:6px;
}
.variant-tab.active{border-color:var(--accent-dim);color:var(--text);background:rgba(217,164,65,0.08);}
.variant-tab .default-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.metric-editor-table td, .metric-editor-table th{white-space:normal;}
.metric-editor-table input, .metric-editor-table select{
  background:var(--panel3);border:1px solid var(--border);color:var(--text);border-radius:5px;
  padding:5px 7px;font-size:12px;width:100%;
}
.metric-editor-table .num-in{width:64px;text-align:right;}
.metric-editor-table .label-in{min-width:140px;}
.metric-editor-table .src-in{min-width:190px;}
.mode-toggle{display:flex;gap:4px;}
.mode-btn{
  font-size:10.5px;padding:4px 7px;border-radius:4px;border:1px solid var(--border);background:var(--panel3);color:var(--text-faint);
}
.mode-btn.active{background:var(--accent-dim);color:#fff;border-color:var(--accent-dim);}

/* ---------- misc ---------- */
.hr{height:1px;background:var(--border-soft);margin:22px 0;border:none;}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:var(--panel3);border:1px solid var(--border);padding:11px 16px;border-radius:7px;font-size:13px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,0.5);min-width:240px;animation:slideIn .18s ease-out;
}
.toast.err{border-color:rgba(229,103,95,0.4);}
@keyframes slideIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.spinner{
  width:15px;height:15px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);
  animation:spin .7s linear infinite;display:inline-block;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap{display:flex;align-items:center;gap:10px;color:var(--text-faint);padding:60px 0;justify-content:center;font-size:13px;}
.small-muted{color:var(--text-faint);font-size:11.5px;}
.legend-note{font-size:11.5px;color:var(--text-faint);margin-top:10px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:760px){
  .two-col{grid-template-columns:1fr;}
  .bench-layout{flex-direction:column;}
  .espec-sidebar{width:100%;flex-direction:row;flex-wrap:wrap;}
  .nav{overflow-x:auto;}
  .topbar-inner{gap:14px;}
}
.fight-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.fight-row:last-child{border-bottom:none;}
.fight-row .fname{color:var(--text);font-weight:500;}
.fight-row .fmeta{color:var(--text-faint);display:flex;gap:14px;}
.dot-success{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:7px;}
.dot-fail{width:7px;height:7px;border-radius:50%;background:var(--danger);display:inline-block;margin-right:7px;}
.details{border:1px solid var(--border-soft);border-radius:var(--radius);background:var(--panel);}
.details > summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between;}
.details > summary::-webkit-details-marker{display:none;}
.details[open] > summary{border-bottom:1px solid var(--border-soft);}
.modal-backdrop{position:fixed;inset:0;background:rgba(6,7,9,0.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 800px at 15% -10%, #151a22 0%, var(--bg) 55%);
}
.auth-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:28px 26px;}
.auth-card .brand-mark{margin-bottom:14px;}
.auth-card h1{font-size:19px;margin-bottom:6px;}
.auth-card p.sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;line-height:1.5;}
.auth-card .field{margin-bottom:14px;}
.auth-error{color:var(--danger);font-size:12.5px;margin-top:-6px;margin-bottom:14px;}
.auth-note{font-size:11.5px;color:var(--text-faint);margin-top:16px;line-height:1.5;}
.role-badge{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.05em;border:1px solid;
}
.role-badge-officer{color:var(--accent);border-color:var(--accent-dim);background:rgba(217,164,65,0.08);}
.role-badge-viewer{color:var(--text-dim);border-color:var(--border);background:var(--panel2);}
.modal{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:22px;max-width:420px;width:100%;}
.modal h3{margin-bottom:10px;}
.modal p{color:var(--text-dim);font-size:13px;margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
'use strict';

/* =========================================================================
   CONSTANTS
   ========================================================================= */

const ESPEC_GROUPS = {
  Guardian: ['Guardian','Dragonhunter','Firebrand','Willbender','Luminary'],
  Revenant: ['Revenant','Herald','Renegade','Vindicator','Conduit'],
  Warrior: ['Warrior','Berserker','Spellbreaker','Bladesworn','Paragon'],
  Engineer: ['Engineer','Scrapper','Holosmith','Mechanist','Amalgam'],
  Ranger: ['Ranger','Druid','Soulbeast','Untamed','Galeshot'],
  Thief: ['Thief','Daredevil','Deadeye','Specter','Antiquary'],
  Elementalist: ['Elementalist','Tempest','Weaver','Catalyst','Evoker'],
  Mesmer: ['Mesmer','Chronomancer','Mirage','Virtuoso','Troubadour'],
  Necromancer: ['Necromancer','Reaper','Scourge','Harbinger','Ritualist'],
};
const ALL_ESPECS = Object.values(ESPEC_GROUPS).flat();
const GENERAL_KEY = 'General';

const TRACKED_BOONS = ['Stability','Protection','Aegis','Might','Fury','Quickness','Alacrity',
  'Regeneration','Vigor','Swiftness','Resistance','Resolution','Superspeed','Stealth'];

// nativeUnit: 'per_second' | 'per_minute' | 'none'. Rate metrics (per_second/per_minute)
// get a unit dropdown in the benchmark editor with automatic min↔sec conversion. 'none'
// metrics (%, raw totals, peak values) show a fixed unit label instead.
// aggregate: 'weighted' (default, duration-weighted average across fights) or 'max'
// (take the single highest value seen across fights — used for peak burst stats).
const BUILT_IN_METRICS = [
  {key:'damage', label:'Damage', nativeUnit:'per_second', dir:'higher'},
  {key:'power_damage', label:'Power Damage', nativeUnit:'per_second', dir:'higher'},
  {key:'condi_damage', label:'Condition Damage', nativeUnit:'per_second', dir:'higher'},
  {key:'healing', label:'Healing', nativeUnit:'per_second', dir:'higher'},
  {key:'barrier', label:'Barrier', nativeUnit:'per_second', dir:'higher'},
  {key:'cleanses', label:'Condition Cleanses', nativeUnit:'per_minute', dir:'higher'},
  {key:'strips', label:'Boon Strips', nativeUnit:'per_minute', dir:'higher'},
  {key:'resurrects', label:'Resurrects', nativeUnit:'per_minute', dir:'higher'},
  {key:'hits_soaked', label:'Hits Soaked', nativeUnit:'per_minute', dir:'higher'},
  {key:'blocks', label:'Blocks', nativeUnit:'per_second', dir:'higher'},

/* =========================================================================
   STORAGE HELPERS
   Three possible backends, chosen once at load:
     - 'artifact'  : window.storage, injected only inside the Claude.ai artifact
                     sandbox. Shared with everyone who opens the artifact there.
     - 'idb'       : IndexedDB in this browser. Used automatically when running
                     the file locally (e.g. via VS Code). Private to this
                     browser/profile only, survives reloads, high capacity.
     - 'local'     : localStorage fallback if IndexedDB is unavailable
                     (e.g. very old browsers, or some file:// restrictions).
   ========================================================================= */

const STORAGE_BACKEND = (typeof window !== 'undefined' && window.storage) ? 'artifact'
  : (typeof indexedDB !== 'undefined') ? 'idb' : 'local';
const LS_PREFIX = 'skirmish-report::';

let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open('skirmish-report-db', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _idbPromise;
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('kv','readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = ()=> resolve(req.result === undefined ? null : req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbDelete(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').delete(key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

function storageBackendLabel(){
  if(STORAGE_BACKEND === 'artifact') return 'Shared · Claude Storage';
  if(STORAGE_BACKEND === 'idb') return 'Local · This Browser Only';
  return 'Local · localStorage Only';
}

async function storeGet(key, shared=true){
  try{
    if(STORAGE_BACKEND === 'artifact'){
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : null;
    } else if(STORAGE_BACKEND === 'idb'){
      // Only the NEW personal/session namespace gets a prefix — shared keys keep their
      // original, unprefixed form so existing local IndexedDB data isn't orphaned.
      return await idbGet(shared ? key : ('personal:'+key));
    } else {
      const raw = localStorage.getItem(LS_PREFIX + (shared ? key : ('personal:'+key)));
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ console.error('storeGet failed', key, e); return null; }
}
async function storeSet(key, value, shared=true){
  try{
    if(STORAGE_BACKEND === 'artifact'){
      await window.storage.set(key, JSON.stringify(value), shared);
    } else if(STORAGE_BACKEND === 'idb'){
      await idbSet(shared ? key : ('personal:'+key), value);
    } else {
      localStorage.setItem(LS_PREFIX + (shared ? key : ('personal:'+key)), JSON.stringify(value));
    }
    return true;
  }catch(e){
    console.error('storeSet failed', key, e);
    toast('Could not save "'+key+'" — storage may be full or unavailable.', true);
    return false;
  }
}
async function storeDelete(key, shared=true){
  try{
    if(STORAGE_BACKEND === 'artifact') await window.storage.delete(key, shared);
    else if(STORAGE_BACKEND === 'idb') await idbDelete(shared ? key : ('personal:'+key));
    else localStorage.removeItem(LS_PREFIX + (shared ? key : ('personal:'+key)));
  }catch(e){}
}

/* =========================================================================
   AUTH  (soft access gate — see boot-sequence notes: no backend exists to
   validate credentials securely, so this deters casual access and separates
   viewer vs officer capability, but is not resistant to a determined user
   with browser devtools. Passphrases are never stored in plaintext.)
   ========================================================================= */

async function sha256Hex(text){
  const data = new TextEncoder().encode(text + '::skirmish-report');
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=> b.toString(16).padStart(2,'0')).join('');
}

function renderAuthSetup(){

    <div class="field"><label>Viewer passphrase</label><input type="password" id="setupViewer" autocomplete="new-password"></div>
    <div class="field"><label>Officer passphrase</label><input type="password" id="setupOfficer" autocomplete="new-password"></div>

    <button class="btn btn-primary" id="setupSubmit" style="width:100%;justify-content:center;">Save & continue as officer</button>
    <p class="auth-note">These are stored as one-way hashes, not plaintext — but this is a static page with no server, so treat this as a light deterrent, not real security. Anyone with strong technical access to this file can bypass it.</p>
  `);
  document.getElementById('setupSubmit').addEventListener('click', async ()=>{
    const v = document.getElementById('setupViewer').value;
    const o = document.getElementById('setupOfficer').value;

    if(!v || !o){ errEl.textContent = 'Both passphrases are required.'; errEl.style.display='block'; return; }
    if(v === o){ errEl.textContent = 'Use two different passphrases.'; errEl.style.display='block'; return; }
    const viewerHash = await sha256Hex(v);
    const officerHash = await sha256Hex(o);
    await storeSet('auth-config', {viewerHash, officerHash, setupComplete:true});

function renderAuthLogin(){
  document.getElementById('app').innerHTML = authShell(`
    <h1>Skirmish Report</h1>
    <p class="sub">Enter the viewer or officer passphrase to continue.</p>
    <div class="field"><label>Passphrase</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <div id="loginError" class="auth-error" style="display:none;"></div>
    <button class="btn btn-primary" id="loginSubmit" style="width:100%;justify-content:center;">Log in</button>
  `);
  const submit = async ()=>{
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    if(!pass){ errEl.textContent = 'Enter a passphrase.'; errEl.style.display='block'; return; }
    const config = await getAuthConfig();
    const hash = await sha256Hex(pass);
    let role = null;
    if(hash === config.officerHash) role = 'officer';
    else if(hash === config.viewerHash) role = 'viewer';
    if(!role){ errEl.textContent = 'Incorrect passphrase.'; errEl.style.display='block'; return; }
    await setAuthSession(role);
    currentRole = role;
    render();
  };
  document.getElementById('loginSubmit').addEventListener('click', submit);
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  document.getElementById('loginPass').focus();
}

// Returns true if the app should proceed to render(); false if a setup/login
// screen was shown instead (render() must not be called in that case).
async function ensureAuthenticated(){
  const config = await getAuthConfig();
  if(!config || !config.setupComplete){
    renderAuthSetup();
    return false;
  }
  const session = await getAuthSession();
  if(session && (session.role==='officer' || session.role==='viewer')){
    currentRole = session.role;
    return true;
  }
  renderAuthLogin();
  return false;
}

async function logOut(){

/* =========================================================================
   LOG PARSING  (Elite Insights "detailed WvW" JSON)
   ========================================================================= */

function buildBuffInfo(buffMap){
  // name -> {id, stacking}. "stacking" buffs (Stability, Might, ...) report a
  // different "uptime" semantic than boolean buffs — see extractPlayer below.
  const m = {};
  if(!buffMap) return m;
  for(const k in buffMap){
    const entry = buffMap[k];
    const name = entry && entry.name;
    if(name){
      const id = k.charAt(0)==='b' ? k.slice(1) : k;
      m[name] = { id: String(id), stacking: !!entry.stacking };
    }
  }
  return m;
}
function buildSkillIdToName(skillMap){
  const m = {};
  if(!skillMap) return m;
  for(const k in skillMap){
    const id = k.charAt(0)==='s' ? k.slice(1) : k;
    m[id] = (skillMap[k] && skillMap[k].name) || null;
  }
  return m;
}

// For every tracked boon, sums each squad member's own buffUptimes.generated[sourceName]
// across the WHOLE roster to get "total boon-seconds this source player granted to the
// squad, in this fight" — a raw, absolute quantity (not a rate). This is the only per-source
// generation data actually present in these logs (squadBuffVolumes.outgoing turned out to
// be an undocumented, inconsistently-scaled EI-internal number — see benchmark notes).
// For every tracked boon, sums each squad member's own buffUptimesActive[sourceName]
// across the WHOLE roster to get "total boon-seconds this source player granted to the
// squad, in this fight (active-time basis)". Mirrors the same stacking-vs-non-stacking
// field split already used for uptime: stacking buffs (Stability, Might...) use
// "generatedPresence" (their real "did I contribute a stack, at all" number);
// non-stacking buffs (Protection, Quickness...) don't populate that field at all
// (it's always 0), so they use "generated" instead.
// Per explicit request: Stability generation specifically sums contributions from BOTH
// buffUptimes and buffUptimesActive (not just one, and not one as a fallback for the
// other) — a deliberate choice, not an oversight. Every other boon keeps the normal
// single-array behavior (prefer buffUptimesActive, fall back to buffUptimes if absent).
function buildBoonGenerationTotals(rawPlayers, buffInfo){
  const totalsByBoonId = {};
  TRACKED_BOONS.forEach(name=>{
    const info = buffInfo[name];
    if(!info) return;
    const totals = {};
    const doubleCount = (name === 'Stability');
    rawPlayers.forEach(recipient=>{
      const arraysToSum = doubleCount
        ? [recipient.buffUptimes||[], recipient.buffUptimesActive||[]]
        : [recipient.buffUptimesActive || recipient.buffUptimes || []];
      arraysToSum.forEach(arr=>{
        arr.forEach(b=>{
          if(String(b.id) !== info.id) return;
          const bd = b.buffData && b.buffData[0];
          const genMap = (info.stacking ? (bd && bd.generatedPresence) : (bd && bd.generated)) || {};
          for(const sourceName in genMap){
            totals[sourceName] = (totals[sourceName]||0) + (genMap[sourceName]||0);
          }
        });
      });
    });
    totalsByBoonId[info.id] = totals;
  });
  return totalsByBoonId;
}

// damage1S is a CUMULATIVE per-second damage series (index i = total damage by second i).
// Peak burst = the largest damage delta across any rolling `window`-second span.
function peakBurstFromCumulative(series, window){
  if(!Array.isArray(series) || series.length < 2) return 0;
  let best = 0;
  for(let i=window; i<series.length; i++){
    const windowDamage = series[i] - series[i-window];
    if(windowDamage > best) best = windowDamage;
  }
  if(series.length <= window){
    best = Math.max(best, series[series.length-1] - series[0]);
  }
  return best;
}

function extractPlayer(p, durationSec, buffInfo, skillIdToName, boonGenTotals){
  const dps = (p.dpsAll && p.dpsAll[0]) || {};
  const stats = (p.statsAll && p.statsAll[0]) || {};
  const defs = (p.defenses && p.defenses[0]) || {};
  const sup = (p.support && p.support[0]) || {};
  // Active time (alive + connected), used specifically as the denominator for boon
  // generation rate — NOT for duration/DPS/other stats, which stay on raw fight length.
  const activeTimeSec = (Array.isArray(p.activeTimes) && p.activeTimes[0] != null)
    ? Math.max(p.activeTimes[0]/1000, 0.001) : durationSec;

  // "OutgoingHealing"/"OutgoingBarrier" are the TRUE totals per phase (self + allies
  // combined). "OutgoingHealingAllies"/"OutgoingBarrierAllies" — used here previously —
  // are explicitly ally-only per EI's schema, silently excluding all self-healing/
  // self-barrier. Confirmed against real logs: that undercounted healers by a real,
  // non-trivial margin (e.g. a dedicated healer missing 300-600 healing per fight).
  // Indexed like every other stat in this file (dpsAll[0], statsAll[0], ...) — these
  // WvW kill logs are always single-phase.
  const healingPerSec = (p.extHealingStats && p.extHealingStats.outgoingHealing && p.extHealingStats.outgoingHealing[0] && p.extHealingStats.outgoingHealing[0].hps) || 0;
  const barrierPerSec = (p.extBarrierStats && p.extBarrierStats.outgoingBarrier && p.extBarrierStats.outgoingBarrier[0] && p.extBarrierStats.outgoingBarrier[0].bps) || 0;

  const metrics = {
    damage: dps.dps || 0,
    power_damage: dps.powerDps || 0,
    condi_damage: dps.condiDps || 0,
    healing: healingPerSec,
    barrier: barrierPerSec,
    cleanses: ((sup.condiCleanse||0) + (sup.condiCleanseSelf||0)) / durationSec * 60,
    strips: (sup.boonStrips||0) / durationSec * 60,
    resurrects: (sup.resurrects||0) / durationSec * 60,
    hits_soaked: (defs.damageTakenCount||0) / durationSec * 60,
    blocks: (defs.blockedCount||0) / durationSec,
    dodges: (defs.dodgeCount||0) / durationSec * 60,
    times_downed: (defs.downCount||0) / durationSec * 60,
    deaths: (defs.deadCount||0) / durationSec * 60,
    applied_cc: (stats.appliedCrowdControl||0) / durationSec * 60,
    interrupts: (stats.interrupts||0) / durationSec * 60,
    tag_distance: (stats.distToCom!=null ? stats.distToCom : 0),
    damage_taken: (defs.damageTaken||0) / durationSec,
    // How many times this player personally downed / got the killing blow on an enemy.
    enemy_downs: (stats.downed||0) / durationSec * 60,
    enemy_kills: (stats.killed||0) / durationSec * 60,
    // EI's own "downContribution" stat: sum of damage dealt from 90% HP down to the
    // enemy being downed, counted only for downs that led to an actual death.
    down_contribution: (stats.downContribution||0) / durationSec,
    // Highest total damage landed in any rolling 3s / 5s window this fight, from the
    // per-second cumulative damage series. Not a rate — aggregated via MAX across
    // fights (see PEAK_METRIC_KEYS), not duration-weighted average.
    peak_3s_burst: peakBurstFromCumulative((p.damage1S && p.damage1S[0]) || null, 3),
    peak_5s_burst: peakBurstFromCumulative((p.damage1S && p.damage1S[0]) || null, 5),
  };

  const boons = {};
  const uptimeById = {}, presenceById = {};
  (p.buffUptimes||[]).forEach(b=>{
    const bd = b.buffData && b.buffData[0];
    const id = String(b.id);
    uptimeById[id] = (bd && bd.uptime) || 0;
    presenceById[id] = (bd && bd.presence) || 0;
  });
  TRACKED_BOONS.forEach(name=>{
    const info = buffInfo[name];
    if(!info) return;
    // Stacking buffs (Stability, Might, ...): EI's "uptime" field is a stack-intensity
    // number, not a %. "presence" is the real "was this buff up at all" percentage —
    // that's what we want for a "Stability Uptime" style metric. Non-stacking buffs
    // (Protection, Quickness, ...) don't populate "presence", so use "uptime" for those.
    const uptimePct = info.stacking ? (presenceById[info.id] || 0) : (uptimeById[info.id] || 0);
    // Raw seconds of this boon generated to the squad THIS FIGHT — not yet divided by
    // anything. Generation rate is computed later by summing this across every fight a
    // player attended and dividing once by their total ACTIVE TIME across those fights.
    const genRawSeconds = (boonGenTotals[info.id] && boonGenTotals[info.id][p.name]) || 0;
    boons[name] = { uptime: uptimePct, genRawSeconds };
  });

  const casts = {};
  (p.rotation||[]).forEach(r=>{
    const name = skillIdToName[r.id];
    if(name){ casts[name] = (casts[name]||0) + ((r.skills||[]).length); }
  });

  return {
    account: p.account || p.name,
    name: p.name || p.account,
    profession: p.profession || 'Unknown',
    group: p.group,
    durationSec,
    activeTimeSec,
    metrics, boons, casts
  };
}

function extractFight(json, fallbackId){
  const durationSec = Math.max((json.durationMS||0)/1000, 1);
  const buffInfo = buildBuffInfo(json.buffMap);
  const skillIdToName = buildSkillIdToName(json.skillMap);
  const rawPlayers = (json.players||[]).filter(p=> !p.friendlyNPC && !p.isFake && !p.notInSquad);
  const boonGenTotals = buildBoonGenerationTotals(rawPlayers, buffInfo);
  const players = rawPlayers.map(p=> extractPlayer(p, durationSec, buffInfo, skillIdToName, boonGenTotals));
  const dateStr = (json.timeStart || json.timeStartStd || '').slice(0,10) || null;
  return {
    // NOTE: eiLogID is NOT reliably unique per fight in this exporter (it can be
    // shared across an entire recording session), so identity is built from the
    // fight's own start time + map instead, falling back to a random id per file.
    id: (json.timeStart || json.timeStartStd) ? (String(json.timeStart||json.timeStartStd)+'@'+(json.mapID!=null?json.mapID:'')) : fallbackId,
    fightName: json.fightName || 'Unknown Fight',
    mapID: json.mapID,
    timeStart: json.timeStart || null,
    dateStr,
    durationSec,
    durationLabel: json.duration || (Math.round(durationSec)+'s'),
    success: !!json.success,
    players
  };
}

/* =========================================================================
   AGGREGATION + GRADING
   ========================================================================= */

function aggregatePlayers(raid, especFilter){
  // especFilter: profession name string, or null for "all"
  const map = {};
  raid.fights.forEach(fight=>{
    fight.players.forEach(p=>{
      if(especFilter && p.profession !== especFilter) return;
      const key = p.account;
      if(!map[key]) map[key] = {account:p.account, name:p.name, totalDuration:0, totalActiveTime:0, metricSum:{}, metricMax:{}, boonUptimeSum:{}, boonGenRawSum:{}, castSum:{}, professionDur:{}};
      const acc = map[key];
      acc.name = p.name;
      acc.totalDuration += p.durationSec;
      acc.totalActiveTime += (p.activeTimeSec != null ? p.activeTimeSec : p.durationSec);
      acc.professionDur[p.profession] = (acc.professionDur[p.profession]||0) + p.durationSec;
      for(const k in p.metrics){
        if(PEAK_METRIC_KEYS.has(k)){
          // Peak stats (burst windows) aggregate as the single best value seen across
          // fights, not a duration-weighted average — averaging peaks isn't meaningful.
          acc.metricMax[k] = Math.max(acc.metricMax[k]||0, p.metrics[k]||0);
        } else {
          acc.metricSum[k] = (acc.metricSum[k]||0) + p.metrics[k]*p.durationSec;
        }
      }
      for(const b in p.boons){
        // Uptime is a %, so it's still duration-weighted-averaged across fights.
        acc.boonUptimeSum[b] = (acc.boonUptimeSum[b]||0) + p.boons[b].uptime * p.durationSec;
        // Generation is a raw count (seconds of boon granted to the squad), so it's a
        // plain sum across every fight attended — no per-fight weighting needed, since
        // it isn't a rate yet. The rate is only computed once, below, against the
        // player's TOTAL ACTIVE TIME across all these fights.
        acc.boonGenRawSum[b] = (acc.boonGenRawSum[b]||0) + (p.boons[b].genRawSeconds||0);
      }
      for(const s in p.casts){
        acc.castSum[s] = (acc.castSum[s]||0) + p.casts[s];
      }
    });
  });
  return Object.values(map).map(acc=>{
    const dur = acc.totalDuration || 1;
    const activeDur = acc.totalActiveTime || dur;
    const metrics = {};
    for(const k in acc.metricSum) metrics[k] = acc.metricSum[k]/dur;
    for(const k in acc.metricMax) metrics[k] = acc.metricMax[k];
    const boons = {};
    const boonNames = new Set([...Object.keys(acc.boonUptimeSum), ...Object.keys(acc.boonGenRawSum)]);
    boonNames.forEach(b=>{
      boons[b] = {
        uptime: (acc.boonUptimeSum[b]||0) / dur,
        // Total boon-seconds generated across every fight attended, divided once by
        // total ACTIVE TIME across those same fights (not raw duration) — matching how
        // this stat is normalized elsewhere (see benchmark notes on active time).
        gen: (acc.boonGenRawSum[b]||0) / activeDur,
        // The same raw sum, but NOT divided by anything — total boon-seconds
        // generated across the whole night (or whichever fights are in scope).
        total: acc.boonGenRawSum[b]||0
      };
    });
    const skillRates = {}; for(const s in acc.castSum) skillRates[s] = acc.castSum[s] / (dur/60);
    let primary='', maxD=-1;
    for(const pr in acc.professionDur) if(acc.professionDur[pr] > maxD){ maxD = acc.professionDur[pr]; primary = pr; }
    return {account:acc.account, name:acc.name, durationSec:dur, metrics, boons, skillRates, primaryEspec:primary};
  }).sort((a,b)=> b.durationSec - a.durationSec);
}

function resolveMetricValue(agg, source){
  if(!source) return 0;
  if(source.startsWith('builtin:')) return agg.metrics[source.slice(8)] || 0;
  if(source.startsWith('boon_uptime:')) return (agg.boons[source.slice(12)] && agg.boons[source.slice(12)].uptime) || 0;
  // boon_gen_total: kept as an alias of boon_gen: for backward compatibility with any
  // benchmark configs saved before generation was consolidated into one calculation.
  if(source.startsWith('boon_gen_total:')) return (agg.boons[source.slice(15)] && agg.boons[source.slice(15)].gen) || 0;
  if(source.startsWith('boon_gen:')) return (agg.boons[source.slice(9)] && agg.boons[source.slice(9)].gen) || 0;
  if(source.startsWith('boon_total:')) return (agg.boons[source.slice(11)] && agg.boons[source.slice(11)].total) || 0;
  if(source.startsWith('skill_cast:')) return agg.skillRates[source.slice(11)] || 0;
  return 0;
}

// 'per_second' | 'per_minute' | 'none'. Drives whether the benchmark editor shows a
// min/sec unit dropdown (rate metrics) or a fixed unit label (%, totals, peak values).
function nativeUnitForSource(source){
  if(!source) return 'none';
  if(source.startsWith('boon_uptime:')) return 'none';
  if(source.startsWith('boon_gen_total:')) return 'per_second';
  if(source.startsWith('boon_gen:')) return 'per_second';
  if(source.startsWith('boon_total:')) return 'none';
  if(source.startsWith('skill_cast:')) return 'per_minute';
  if(source.startsWith('builtin:')) return (BUILT_IN_BY_KEY[source.slice(8)]||{}).nativeUnit || 'none';
  return 'none';
}
// Accepts either the canonical 'per_second'/'per_minute' tokens or older free-text unit
// values ("per second", "per minute") saved before this was a dropdown, and normalizes
// to a canonical token so both old and new configs grade consistently.
function normalizeDisplayUnit(unitStr, nativeUnit){
  if(unitStr === 'per_second' || unitStr === 'per_minute') return unitStr;
  if(typeof unitStr === 'string'){
    if(/minute/i.test(unitStr)) return 'per_minute';
    if(/second/i.test(unitStr)) return 'per_second';
  }
  return nativeUnit;
}
function convertRateValue(value, nativeUnit, displayUnit){
  if(nativeUnit === 'none' || !displayUnit || nativeUnit === displayUnit) return value;
  if(nativeUnit === 'per_second' && displayUnit === 'per_minute') return value * 60;
  if(nativeUnit === 'per_minute' && displayUnit === 'per_second') return value / 60;
  return value;
}

function gradeForValue(value, thresholds, dir){
  if(dir === 'lower'){
    for(const g of GRADE_ORDER) if(value <= thresholds[g]) return g;
    return 'F';
  }else{
    for(const g of GRADE_ORDER) if(value >= thresholds[g]) return g;
    return 'F';
  }
}

function computeRowGrades(agg, metrics){
  const cells = metrics.map(m=>{
    const nativeUnit = nativeUnitForSource(m.source);
    let value = resolveMetricValue(agg, m.source);
    let displayUnit = m.unit;
    if(nativeUnit === 'per_second' || nativeUnit === 'per_minute'){
      displayUnit = normalizeDisplayUnit(m.unit, nativeUnit);
      value = convertRateValue(value, nativeUnit, displayUnit);
    }
    const grade = gradeForValue(value, m.thresholds, m.dir);
    return {metricId:m.id, value, grade, mode:m.mode, weight:m.weight, unit:displayUnit};
  });
  const graded = cells.filter(c=> c.mode === 'graded');
  let overall = null;
  if(graded.length){
    const totalW = graded.reduce((s,c)=>s+(Number(c.weight)||0), 0) || 1;
    const pts = graded.reduce((s,c)=> s + GRADE_POINTS[c.grade]*(Number(c.weight)||0), 0) / totalW;
    overall = POINT_TO_GRADE[Math.max(0,Math.min(5,Math.round(pts)))];
  }
  return {cells, overall};
}

function formatUnit(value, unit){
  let v;
  if(unit === '%') v = (value).toFixed(1)+'%';
  else if(unit === 'units') v = Math.round(value).toLocaleString();
  else v = (Math.abs(value) >= 100 ? Math.round(value).toLocaleString() : value.toFixed(2));
  return v;
}

// Default unit to store when a metric's Source changes: the canonical rate token
// ('per_second'/'per_minute') for rate metrics — which the editor then shows as a
// dropdown — or the fixed display unit (%, units, seconds, damage) for everything else.
function unitForSource(source){
  if(source.startsWith('boon_uptime:')) return '%';

  if(source.startsWith('boon_gen:')) return 'per_second';

    if(!bi) return '';
    if(bi.nativeUnit === 'per_second' || bi.nativeUnit === 'per_minute') return bi.nativeUnit;

function labelForSource(source){

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function fmtDate(dateStr){
  if(!dateStr) return 'Unknown date';

  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined,{weekday:'short', year:'numeric', month:'short', day:'numeric'});
}
function fmtDuration(sec){
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m+'m '+String(s).padStart(2,'0')+'s';
}
function toast(msg, isErr){

}

function parseFolderNameToDate(name){
  if(!name) return null;
  let m = name.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // 2026-08-19
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = name.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/); // 8-19-2026 or 8/19/2026 (US M-D-Y)
  if(m) return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  return null;
}
function slugify(s){
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'raid';
}

function wireUploadPage(){
  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  const folderBtn = document.getElementById('folderBtn');
  const folderInput = document.getElementById('folderInput');
  if(!dz) return;

  dz.addEventListener('click', ()=> fi.click());
  fi.addEventListener('change', e=>{
    const items = Array.from(e.target.files||[]).filter(f=>f.name.endsWith('.json')).map(f=>({file:f, folderName:null}));
    handleFiles(items);
    fi.value = '';
  });
  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('hover'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('hover'); }));
  dz.addEventListener('drop', e=>{
    const items = Array.from(e.dataTransfer.files||[]).filter(f=> f.name.endsWith('.json')).map(f=>({file:f, folderName:null}));
    handleFiles(items);
  });

  folderBtn.addEventListener('click', ()=> folderInput.click());
  folderInput.addEventListener('change', e=>{
    const files = Array.from(e.target.files||[]).filter(f=> f.name.endsWith('.json'));
    const items = files.map(f=>{
      // webkitRelativePath looks like "Raid Nights/8-19-2026/log.json"
      const rel = f.webkitRelativePath || f.name;
      const parts = rel.split('/');
      // folder immediately containing the file, if the file is nested at least 2 deep
      const folderName = parts.length >= 3 ? parts[parts.length-2] : null;
      return {file:f, folderName};
    });
    if(!items.length){ toast('No .json files found in that folder.', true); return; }
    handleFiles(items);
    folderInput.value = '';
  });
}

// Average damage/sec of the 5 hardest-hitting squad members in a fight — a quick
// signal for whether a log represents real focused combat vs. an incidental skirmish.
function top5DpsAverage(fight){
  const dpsValues = fight.players.map(p=> p.metrics.damage).sort((a,b)=> b-a).slice(0,5);
  if(!dpsValues.length) return 0;
  return dpsValues.reduce((s,v)=>s+v,0) / dpsValues.length;
}

async function handleFiles(items){
  if(!isOfficer()) return;
  if(!items.length) return;
  if(state.uploadBusy){ toast('Still processing the previous batch — please wait.', true); return; }
  state.uploadBusy = true;
  const listEl = document.getElementById('uploadList');
  const rows = items.map(it=>({file:it.file, folderName:it.folderName, status:'pending', message:''}));
  function paintRows(){
    listEl.innerHTML = rows.map(r=>`
      <div class="upload-row">
        <span class="fname">${r.folderName ? `<span class="small-muted">${esc(r.folderName)}/</span>` : ''}${esc(r.file.name)}</span>
        <span class="status-pill status-${r.status}">${r.status}${r.message ? ' · '+esc(r.message) : ''}</span>
      </div>`).join('');
  }
  paintRows();

  const nightOverride = (document.getElementById('nightNameOverride').value || '').trim();
  const minTop5Dps = parseFloat(document.getElementById('minTop5DpsInput').value) || 0;
  const groups = {}; // groupKey -> {label, dateStr, fights:[]}
  let anyOk = false;
  let skippedCount = 0;

  for(const row of rows){
    row.status = 'parsing'; paintRows();
    await new Promise(res=>setTimeout(res, 10)); // yield to UI
    try{
      const text = await readFileText(row.file);
      const json = JSON.parse(text);
      const fight = extractFight(json, row.file.name+'-'+uid());

      const top5avg = top5DpsAverage(fight);
      if(minTop5Dps > 0 && top5avg < minTop5Dps){
        row.status = 'skipped';
        row.message = 'top 5 DPS avg '+Math.round(top5avg).toLocaleString()+' < '+minTop5Dps.toLocaleString();
        skippedCount++;
        paintRows();
        await new Promise(res=>setTimeout(res, 0));
        continue;
      }

      const folderDate = parseFolderNameToDate(row.folderName);
      const groupKey = row.folderName ? ('folder:'+row.folderName.toLowerCase()) : ('date:'+(fight.dateStr||'unknown'));
      const label = row.folderName || (fight.dateStr ? ('Raid Night — '+fight.dateStr) : 'Unsorted Fights');
      const dateStr = folderDate || fight.dateStr || null;
      if(!groups[groupKey]) groups[groupKey] = {label, dateStr, fights:[]};
      if(!groups[groupKey].dateStr) groups[groupKey].dateStr = dateStr;
      groups[groupKey].fights.push(fight);
      row.status = 'done';
      row.message = fight.players.length+' players · top 5 DPS avg '+Math.round(top5avg).toLocaleString();
      anyOk = true;
    }catch(err){
      console.error(err);
      row.status = 'error';
      row.message = (err && err.message) ? err.message.slice(0,60) : 'failed to parse';
    }
    paintRows();
    await new Promise(res=>setTimeout(res, 0));
  }

  if(anyOk){
    const idx = await storeGet('raids-index') || [];
    let touchedIds = [];
    for(const groupKey in groups){
      const g = groups[groupKey];
      if(!g.fights.length) continue;
      let entry = idx.find(r=> r.groupKey === groupKey);
      let raid;
      if(entry){
        raid = await storeGet('raid:'+entry.id);
        if(!raid) raid = {id:entry.id, groupKey, name:entry.name, dateStr:g.dateStr, excluded:false, fights:[]};
      } else {
        const id = slugify(g.label)+'-'+uid().slice(0,5);
        raid = {id, groupKey, name: nightOverride || g.label, dateStr:g.dateStr, excluded:false, fights:[]};
        entry = {id, groupKey, name:raid.name, dateStr:g.dateStr, fightCount:0, excluded:false};
        idx.push(entry);
      }
      const existingIds = new Set(raid.fights.map(f=>f.id));
      g.fights.forEach(f=>{ if(!existingIds.has(f.id)){ raid.fights.push(f); existingIds.add(f.id); } });
      raid.fights.sort((a,b)=> (a.timeStart||'').localeCompare(b.timeStart||''));
      if(!raid.dateStr) raid.dateStr = g.dateStr;
      entry.fightCount = raid.fights.length;
      entry.name = raid.name;
      entry.dateStr = raid.dateStr;
      await storeSet('raid:'+raid.id, raid);
      touchedIds.push(raid.id);
    }
    await storeSet('raids-index', idx);
    toast('Logs added to '+touchedIds.length+' raid night'+(touchedIds.length>1?'s':'')+(skippedCount ? '. '+skippedCount+' low-intensity fight'+(skippedCount>1?'s':'')+' skipped.' : '.'));
    if(touchedIds.length === 1){
      setTimeout(()=>{ location.hash = '#/raid/'+encodeURIComponent(touchedIds[0]); }, 500);
    }
  } else if(skippedCount){
    toast('All '+skippedCount+' fight'+(skippedCount>1?'s were':' was')+' below the DPS threshold — nothing added.', true);
  }
  state.uploadBusy = false;
}

function readFileText(file){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=> resolve(fr.result);
    fr.onerror = ()=> reject(new Error('could not read file'));
    fr.readAsText(file);
  });
}

let raidPageCache = { raid:null, benchmarks:null, especDisplay:null, activeEspec:null, extraEspecs:[], chipEditMode:false, viewingVariant:{},
  especSort:{key:'overall',dir:'desc'}, generalSort:{key:'overall',dir:'desc'} };

  }

  const especDisplay = await ensureEspecDisplay();
  const hiddenSet = new Set(especDisplay.hidden);
  const orderIndex = {}; especDisplay.order.forEach((e,i)=>{ orderIndex[e]=i; });
  const especsPresentRaw = Array.from(new Set(
    raid.fights.flatMap(f=> f.players.map(p=>p.profession))
  )).filter(e=> ALL_ESPECS.includes(e));
  const especsPresent = especsPresentRaw
    .filter(e=> !hiddenSet.has(e))
    .sort((a,b)=> (orderIndex[a]??999) - (orderIndex[b]??999));

  raidPageCache.raid = raid;
  raidPageCache.benchmarks = benchmarks;
  raidPageCache.especDisplay = especDisplay;
  if(!raidPageCache.activeEspec || raidPageCache.raidId !== id || !especsPresent.concat(raidPageCache.extraEspecs).includes(raidPageCache.activeEspec)){
    raidPageCache.activeEspec = especsPresent[0] || null;
    raidPageCache.extraEspecs = [];
  }
  if(raidPageCache.raidId !== id){
    raidPageCache.especSort = {key:'overall', dir:'desc'};
    raidPageCache.generalSort = {key:'overall', dir:'desc'};
    raidPageCache.chipEditMode = false;
    raidPageCache.viewingVariant = {};
  }
  raidPageCache.raidId = id;
  raidPageCache.especsPresent = especsPresent;

  const totalDuration = raid.fights.reduce((s,f)=>s+f.durationSec,0);
  const totalPlayers = new Set(raid.fights.flatMap(f=>f.players.map(p=>p.account))).size;

  const fightRows = raid.fights.map(f=>`

      <span class="fmeta"><span>${f.timeStart ? esc(f.timeStart.slice(11,19)) : ''}</span><span>${esc(f.durationLabel)}</span><span>${f.players.length} players</span></span>

    <div>
      <div class="eyebrow"><a href="#/raids" style="color:var(--text-faint)">← Raid Nights</a></div>
      <h1 class="page-title">
        ${isOfficer()
          ? `<input class="inline-edit" id="raidNameInput" value="${escAttr(raid.name)}" style="font-size:24px;font-weight:700;font-family:Sora;width:min(560px,80vw)">`
          : `<span style="font-size:24px;font-weight:700;font-family:Sora;">${esc(raid.name)}</span>`}
      </h1>
      <p class="page-desc">${raid.dateStr ? fmtDate(raid.dateStr) : 'Date unknown'} · ${raid.fights.length} fights · ${fmtDuration(totalDuration)} total · ${totalPlayers} players</p>
    </div>
    ${isOfficer() ? `
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sm" id="toggleExcludeBtn">${raid.excluded ? 'Un-exclude' : 'Exclude from grading'}</button>
      <button class="btn btn-sm btn-danger" id="deleteRaidBtn">Delete raid</button>
    </div>` : (raid.excluded ? `<span class="tag tag-excluded">excluded</span>` : '')}
  </div>

  <details class="details">
    <summary>Fights in this raid night (${raid.fights.length}) <span class="small-muted">click to expand</span></summary>
    <div>${fightRows || '<div class="fight-row">No fights.</div>'}</div>
  </details>

  <div class="section-title">Grades by espec</div>
  <div class="section-sub">Weighted by time played. Switch tabs to grade a different elite spec against its benchmark.</div>
  <div id="chipRowWrap">${renderEspecChips()}</div>
  <div id="especGradeTable">${renderEspecGradeTable()}</div>

  <div class="section-title">General grades</div>

function renderEspecChips(){
  const { especsPresent, extraEspecs, activeEspec, especDisplay, chipEditMode } = raidPageCache;
  const hiddenCount = especDisplay.hidden.length;
  const all = especsPresent.concat(extraEspecs.filter(e=>!especsPresent.includes(e)));
  const editable = chipEditMode && isOfficer();
  const chips = all.map(e=>{
    const isExtra = extraEspecs.includes(e) && !especsPresent.includes(e);
    const posInPresent = especsPresent.indexOf(e);
    const canMoveLeft = !isExtra && posInPresent > 0;
    const canMoveRight = !isExtra && posInPresent < especsPresent.length-1;
    let controls = '';
    if(editable){
      if(isExtra){
        controls = `<span class="x" data-act="remove-espec" data-espec="${escAttr(e)}" title="Remove this tab">✕</span>`;
      } else {
        controls = `
          <span class="chip-reorder ${canMoveLeft?'':'disabled'}" data-act="move-espec-left" data-espec="${escAttr(e)}" title="Move left">‹</span>
          <span class="chip-reorder ${canMoveRight?'':'disabled'}" data-act="move-espec-right" data-espec="${escAttr(e)}" title="Move right">›</span>
          <span class="chip-hide" data-act="hide-espec" data-espec="${escAttr(e)}" title="Hide this class from raid nights">🙈</span>`;
      }
    } else if(isExtra){
      controls = `<span class="x" data-act="remove-espec" data-espec="${escAttr(e)}" title="Remove this tab">✕</span>`;
    }
    return `<div class="chip ${e===activeEspec?'active':''}" data-espec="${escAttr(e)}">
      <span data-act="select-espec" data-espec="${escAttr(e)}" style="cursor:pointer;">${esc(e)}</span>
      ${controls}
    </div>`;
  }).join('');
  const addOptions = ALL_ESPECS.filter(e=> !all.includes(e))
    .sort((a,b)=> (especDisplay.order.indexOf(a)) - (especDisplay.order.indexOf(b)))
    .map(e=>`<option value="${escAttr(e)}">${esc(e)}</option>`).join('');
  return `<div class="chip-row">${chips}
    <div class="chip-add"><select id="addEspecSelect"><option value="">+ Add specialization…</option>${addOptions}</select></div>
    ${isOfficer() ? `<button class="btn btn-sm btn-ghost" id="toggleChipEditBtn">${chipEditMode ? 'Done' : 'Edit classes'}</button>` : ''}
    ${(isOfficer() && hiddenCount) ? `<button class="btn btn-sm btn-ghost" id="manageHiddenBtn">${hiddenCount} hidden — manage</button>` : ''}
  </div>`;
}

function sortAggRows(rowsWithGrades, sortState){
  const {key, dir} = sortState;
  const mult = dir === 'asc' ? 1 : -1;
  return rowsWithGrades.slice().sort((a,b)=>{
    let av, bv;
    if(key === 'name'){ av=a.agg.name.toLowerCase(); bv=b.agg.name.toLowerCase(); return av<bv ? -mult : av>bv ? mult : 0; }
    if(key === 'espec'){ av=(a.agg.primaryEspec||'').toLowerCase(); bv=(b.agg.primaryEspec||'').toLowerCase(); return av<bv ? -mult : av>bv ? mult : 0; }
    if(key === 'duration'){ return (a.agg.durationSec - b.agg.durationSec)*mult; }
    if(key === 'overall'){
      av = a.overall!=null ? GRADE_POINTS[a.overall] : -1;
      bv = b.overall!=null ? GRADE_POINTS[b.overall] : -1;
      return (av-bv)*mult;
    }
    const ca = a.cells.find(c=>c.metricId===key), cb = b.cells.find(c=>c.metricId===key);
    av = ca ? ca.value : -Infinity; bv = cb ? cb.value : -Infinity;
    return (av-bv)*mult;
  });
}
function sortArrow(sortState, key){
  if(sortState.key !== key) return '<span class="sort-arrow sort-arrow-inactive">↕</span>';
  return `<span class="sort-arrow">${sortState.dir==='asc'?'▲':'▼'}</span>`;
}
function clickSort(sortState, key){
  if(sortState.key === key){ sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc'; }
  else { sortState.key = key; sortState.dir = (key==='name'||key==='espec') ? 'asc' : 'desc'; }
}

function unitDisplayLabel(unit){
  if(unit === 'per_second') return 'per second';
  if(unit === 'per_minute') return 'per minute';
  return unit || '';
}
function metricHeaderCell(m, sortState){
  const nativeUnit = nativeUnitForSource(m.source);
  const displayUnit = nativeUnit==='per_second'||nativeUnit==='per_minute' ? normalizeDisplayUnit(m.unit, nativeUnit) : m.unit;
  const unitText = unitDisplayLabel(displayUnit);
  return `<th class="th-sortable" data-sort-key="${escAttr(m.id)}">${esc(m.label)} ${sortArrow(sortState,m.id)}<span class="wt">${unitText ? esc(unitText)+' · ' : ''}${m.mode==='graded' ? 'Weight '+m.weight : 'info only'}</span></th>`;
}

function renderEspecGradeTable(){
  const { raid, benchmarks, activeEspec, especSort, viewingVariant } = raidPageCache;
  if(!activeEspec) return `<p class="small-muted">No players detected yet — upload fights first.</p>`;
  const bench = benchmarks[activeEspec] || { activeVariant:'default', variants:{default:defaultVariant([])} };
  const variantNames = Object.keys(bench.variants);
  // Viewing a variant is a local, ephemeral display choice — anyone can switch tabs to
  // preview grades under a different variant without writing to shared storage. Only the
  // *default* variant (the dot) is persisted, and only officers can change it, from the
  // Benchmarks page.
  const viewOverride = viewingVariant[activeEspec];
  const activeVariant = (viewOverride && bench.variants[viewOverride]) ? viewOverride
    : (bench.variants[bench.activeVariant] ? bench.activeVariant : variantNames[0]);
  const variant = bench.variants[activeVariant] || defaultVariant([]);
  const metrics = variant.metrics;

  const rowsRaw = aggregatePlayers(raid, activeEspec);
  const variantTabs = variantNames.map(v=>`
    <span class="variant-tab ${v===activeVariant?'active':''}" data-act="select-variant" data-variant="${escAttr(v)}">
      ${v===bench.activeVariant?'<span class="default-dot"></span>':''}${esc(bench.variants[v].label||v)}
    </span>`).join('');

  if(!rowsRaw.length){
    return `<div class="variant-row">${variantTabs}</div><p class="small-muted">No players played ${esc(activeEspec)} this raid night.</p>`;
  }
  if(!metrics.length){
    return `<div class="variant-row">${variantTabs}</div><p class="small-muted">No benchmark metrics configured for ${esc(activeEspec)} yet. <a href="#/benchmarks/${encodeURIComponent(activeEspec)}">Set them up →</a></p>`;
  }
  if(especSort.key !== 'name' && especSort.key !== 'duration' && especSort.key !== 'overall' && !metrics.some(m=>m.id===especSort.key)){
    especSort.key = 'overall'; especSort.dir = 'desc';
  }

  const rowsWithGrades = rowsRaw.map(agg=> Object.assign({agg}, computeRowGrades(agg, metrics)));
  const sortedRows = sortAggRows(rowsWithGrades, especSort);

  const head = `<tr>
    <th class="th-sortable" data-sort-key="name">Player ${sortArrow(especSort,'name')}</th>
    <th class="th-sortable" data-sort-key="duration">Duration ${sortArrow(especSort,'duration')}</th>
    <th class="th-sortable" data-sort-key="overall">Overall ${sortArrow(especSort,'overall')}</th>` +
    metrics.map(m=> metricHeaderCell(m, especSort)).join('') + `</tr>`;

  const body = sortedRows.map(({agg, cells, overall})=>{
    const cellsHtml = cells.map(c=>{
      const unit = c.unit;
      return `<td><div class="metric-cell">${c.mode==='graded' ? `<span class="grade grade-${c.grade}">${c.grade}</span>` : `<span class="grade-dash">–</span>`}<span class="metric-val">${formatUnit(c.value, unit)}</span></div></td>`;
    }).join('');
    return `<tr>
      <td class="player-cell"><div class="pname">${esc(agg.name)}</div><div class="pacc">${esc(agg.account)}</div></td>
      <td class="dur-cell">${fmtDuration(agg.durationSec)}</td>
      <td>${overall ? `<span class="grade grade-${overall}">${overall}</span>` : '<span class="grade-dash">–</span>'}</td>
      ${cellsHtml}
    </tr>`;
  }).join('');

  return `<div class="variant-row">${variantTabs}</div>
    <div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function renderGeneralGradeTable(){
  const { raid, benchmarks, generalSort } = raidPageCache;
  const bench = benchmarks[GENERAL_KEY];
  const variant = bench.variants[bench.activeVariant] || defaultVariant([]);
  const metrics = variant.metrics;
  const rowsRaw = aggregatePlayers(raid, null);
  if(!rowsRaw.length) return `<p class="small-muted">No players in this raid yet.</p>`;
  if(!metrics.length) return `<p class="small-muted">No general metrics configured. <a href="#/benchmarks/${encodeURIComponent(GENERAL_KEY)}">Set them up →</a></p>`;
  if(generalSort.key !== 'name' && generalSort.key !== 'espec' && generalSort.key !== 'duration' && generalSort.key !== 'overall' && !metrics.some(m=>m.id===generalSort.key)){
    generalSort.key = 'overall'; generalSort.dir = 'desc';
  }

  const rowsWithGrades = rowsRaw.map(agg=> Object.assign({agg}, computeRowGrades(agg, metrics)));
  const sortedRows = sortAggRows(rowsWithGrades, generalSort);

  const head = `<tr>
    <th class="th-sortable" data-sort-key="name">Player ${sortArrow(generalSort,'name')}</th>
    <th class="th-sortable" data-sort-key="espec">Espec ${sortArrow(generalSort,'espec')}</th>
    <th class="th-sortable" data-sort-key="duration">Duration ${sortArrow(generalSort,'duration')}</th>
    <th class="th-sortable" data-sort-key="overall">Overall ${sortArrow(generalSort,'overall')}</th>` +
    metrics.map(m=> metricHeaderCell(m, generalSort)).join('') + `</tr>`;
  const body = sortedRows.map(({agg, cells, overall})=>{
    const cellsHtml = cells.map(c=>{
      const unit = c.unit;
      return `<td><div class="metric-cell">${c.mode==='graded' ? `<span class="grade grade-${c.grade}">${c.grade}</span>` : `<span class="grade-dash">–</span>`}<span class="metric-val">${formatUnit(c.value, unit)}</span></div></td>`;
    }).join('');
    return `<tr>
      <td class="player-cell"><div class="pname">${esc(agg.name)}</div><div class="pacc">${esc(agg.account)}</div></td>
      <td>${esc(agg.primaryEspec||'—')}</td>
      <td class="dur-cell">${fmtDuration(agg.durationSec)}</td>
      <td>${overall ? `<span class="grade grade-${overall}">${overall}</span>` : '<span class="grade-dash">–</span>'}</td>
      ${cellsHtml}
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function wireRaidPage(){
  const nameInput = document.getElementById('raidNameInput');
  if(nameInput) nameInput.addEventListener('change', async ()=>{
    const raid = raidPageCache.raid;
    raid.name = nameInput.value.trim() || raid.name;
    await storeSet('raid:'+raid.id, raid);
    const idx = await storeGet('raids-index') || [];
    const entry = idx.find(r=>r.id===raid.id);
    if(entry){ entry.name = raid.name; await storeSet('raids-index', idx); }
    toast('Renamed.');
  });

  const excludeBtn = document.getElementById('toggleExcludeBtn');
  if(excludeBtn) excludeBtn.addEventListener('click', async ()=>{
    const raid = raidPageCache.raid;
    raid.excluded = !raid.excluded;
    await storeSet('raid:'+raid.id, raid);
    const idx = await storeGet('raids-index') || [];
    const entry = idx.find(r=>r.id===raid.id);
    if(entry){ entry.excluded = raid.excluded; await storeSet('raids-index', idx); }
    render();
  });

  const deleteBtn = document.getElementById('deleteRaidBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
    confirmModal('Delete this raid night?', 'This removes all parsed fight and grade data for this night. This cannot be undone.', async ()=>{
      const raid = raidPageCache.raid;
      await storeDelete('raid:'+raid.id);
      const idx = (await storeGet('raids-index') || []).filter(r=>r.id!==raid.id);
      await storeSet('raids-index', idx);
      location.hash = '#/raids';
    });
  });

  wireChipRow();
  wireEspecGradeTable();
  wireGeneralGradeTable();
}
function wireEspecGradeTable(){
  document.querySelectorAll('[data-act="select-variant"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      // Viewing a variant is local-only and available to everyone — it does not touch
      // shared storage. Setting the persisted default variant is an officer-only action
      // done from the Benchmarks page ("Set as default").
      const espec = raidPageCache.activeEspec;
      raidPageCache.viewingVariant[espec] = el.getAttribute('data-variant');
      document.getElementById('especGradeTable').innerHTML = renderEspecGradeTable();
      wireEspecGradeTable();
    });
  });
  document.querySelectorAll('#especGradeTable .th-sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      clickSort(raidPageCache.especSort, th.getAttribute('data-sort-key'));
      document.getElementById('especGradeTable').innerHTML = renderEspecGradeTable();
      wireEspecGradeTable();
    });
  });
}
function wireGeneralGradeTable(){
  document.querySelectorAll('#generalGradeTable .th-sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      clickSort(raidPageCache.generalSort, th.getAttribute('data-sort-key'));
      document.getElementById('generalGradeTable').innerHTML = renderGeneralGradeTable();
      wireGeneralGradeTable();
